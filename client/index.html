  <head>
    <meta charset="UTF-8" />

      name="viewport"

    <meta name="theme-color" content="#ffffff" />
    <title>BOSS OS - Task & Project Management</title>
    <script>
      window.onerror = function (msg, url, line, col, error) {
        if (typeof msg === 'string' && (msg.includes('ResizeObserver') || msg === 'Script error.')) return false;
        
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100%';
        errDiv.style.background = 'red';
        errDiv.style.color = 'white';
        errDiv.style.padding = '10px';
        errDiv.style.zIndex = '999999';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerText = 'Error: ' + msg + '\nURL: ' + url + '\nLine: ' + line + ':' + col + '\nStack: ' + (error ? error.stack : '');
        document.body.appendChild(errDiv);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100%';
        errDiv.style.background = 'orange';
        errDiv.style.color = 'white';
        errDiv.style.padding = '10px';
        errDiv.style.zIndex = '999999';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerText = 'Unhandled Promise: ' + (event.reason ? (event.reason.message || event.reason) : 'Unknown');
        document.body.appendChild(errDiv);
      });
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
