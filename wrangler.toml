name = "boss-os"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist/client"

# [vars]
# Add environment variables via Cloudflare Dashboard or .dev.vars for local dev

[[d1_databases]]
binding = "DB"
database_name = "boss-os-daily-task"
